name: Free notifications
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: morrow-notification-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DATABASE_URL: ${{ secrets.MORROW_DATABASE_URL }}
      NTFY_TOPIC: ${{ secrets.MORROW_NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: node worker.js
